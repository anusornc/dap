global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: 'dap-relay'
    static_configs:
      - targets:
          - dap-relay:3000
    metrics_path: /metrics

  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: 'node'
    static_configs:
      - targets:
          - node-exporter:9100